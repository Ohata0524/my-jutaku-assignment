name: CI

on:
  push:
    branches: [main, feature/ui-implementation]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5sdocker-compose up -d
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Copy env
        run: cp .env.example .env

      - name: Generate Prisma Client
        run: bun x prisma generate
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run Biome Check
        run: bun x @biomejs/biome check .

      - name: Run typecheck
        run: bun x tsc --noEmit

      - name: Run build
        run: |
          # 以前の db:push と migrate deploy の衝突を防ぐため、
          # CI用のクリーンなDBに対してデプロイのみ実行します。
          bun x prisma migrate deploy
          bun run build
        env:
          # ビルド工程全体（特に静的ページ生成時）でURLを確実に認識させます。
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXT_TELEMETRY_DISABLED: 1
