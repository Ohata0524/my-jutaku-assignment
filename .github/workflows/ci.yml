name: CI


on:
  push:
    branches: [main, feature/ui-implementation]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # CI環境でPostgreSQLを起動させる設定
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Copy env
        run: cp .env.example .env

      # DBのマイグレーション（CI上のPostgresに接続）
      - name: Run db:migrate
        run: bun run db:migrate
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # その他のチェック（必要に応じて）
      - name: Run lint
        run: bun run biome:check
      
      - name: Run typecheck
        run: bun run typecheck

      - name: Run build
        run: bun run build
        