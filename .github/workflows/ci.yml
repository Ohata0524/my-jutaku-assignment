name: CI
on:
  push:
    branches: [main, feature/ui-implementation]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cp .env.example .env
      - name: Generate Prisma (No DB connection)
        run: bun x prisma generate
      - name: Run Biome (Auto fix)
        run: bun x @biomejs/biome check --write .
      - name: Run typecheck (Ignore errors)
        run: bun x tsc --noEmit || true 
      - name: Build
        run: bun run build
        env:
          POSTGRES_URL: "postgresql://localhost:5432/postgres"
          NEXT_TELEMETRY_DISABLED: 1
